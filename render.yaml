services:
  - type: web
    name: openattend-api
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npm run dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: openattend-db
          property: connectionString

databases:
  - name: openattend-db
    databaseName: openattend
    user: openattend

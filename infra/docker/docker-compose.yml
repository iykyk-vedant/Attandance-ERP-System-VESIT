services:
  postgres:
    image: postgres:16-alpine
    container_name: openattend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: openattend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openattend"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: openattend-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "jdbc:postgresql://postgres:5432/openattend"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "password"
      JWT_ACCESS_SECRET: "openattend_super_secret_access_jwt_key_32chars_long"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

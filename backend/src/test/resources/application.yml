server:
  port: 0

spring:
  application:
    name: openattend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

openattend:
  allowed-email-domain: ves.ac.in
  jwt:
    secret: test_jwt_secret_key_needs_to_be_at_least_32_bytes_long
    access-expiry-ms: 900000
  sync:
    cron: "0 */15 * * * *"
    cooldown-seconds: 300

name: OpenAttend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Predictor Core Tests
        run: node --test packages/predictor-core/test.js

      - name: Run Sync Idempotency Tests
        run: node apps/api/test/sync.test.js
